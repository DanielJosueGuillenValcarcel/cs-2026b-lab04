# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "AireMisti - Red teaming de la Tarea A (Lab 09)"

prompts:
  - id: file://../criterios/v2.txt
    label: v2
  - id: file://../criterios/v3.txt
    label: v3

providers:
  - id: file://../proveedor_grabado.py
    label: claude-grabado
    config:
      plantillas: criterios
      grabaciones: seguridad/grabaciones/criterios

defaultTest:
  assert:
    - type: is-json
      value: file://../criterios/esquema.json
      metric: A1_contrato_json
    - type: python
      value: file://../criterios/asserts.py:a2_exito_y_error
      metric: A2_exito_y_error

tests: file://ataques-criterios.yaml
