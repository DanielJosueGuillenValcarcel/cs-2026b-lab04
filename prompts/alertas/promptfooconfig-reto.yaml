# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "AireMisti - Reto A: el mismo prompt (Tarea B v3) con dos modelos (Lab 09)"

prompts:
  - id: file://v3.txt
    label: v3

providers:
  - id: file://../proveedor_grabado.py
    label: claude-opus-5.5
    config:
      plantillas: alertas
      grabaciones: alertas/grabaciones
  - id: file://../proveedor_grabado.py
    label: claude-haiku-5.5
    config:
      plantillas: alertas
      grabaciones: reto/grabaciones/haiku

defaultTest:
  assert:
    - type: is-json
      value: file://esquema.json
      metric: B1_contrato_json
    - type: python
      value: file://asserts.py:b2_severidad_correcta
      metric: B2_severidad_correcta
    - type: python
      value: file://asserts.py:b3_no_inventa_valores
      metric: B3_no_inventa_valores
    - type: python
      value: file://asserts.py:b4_sin_consejo_medico
      metric: B4_sin_consejo_medico

tests: file://casos.yaml
