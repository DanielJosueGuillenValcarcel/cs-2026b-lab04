# AireMisti IoT — configuración de Mosquitto 2.0 en el VPS (ADR-003, ADR-007 y ADR-008)

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/servidor.crt
keyfile /etc/mosquitto/certs/servidor.key

# --- Persistencia y colas (ADR-007, QA-01 y QA-03) ---
persistence true
persistence_location /var/lib/mosquitto/
# Guardar en disco cada 60 s. Una caída brusca del broker puede perder hasta 60 s de mensajes;
# el acuse de aplicación (airemisti/<sensor>/ack) hace que el sensor los reenvíe desde su microSD.
autosave_interval 60
# Por defecto Mosquitto guarda como máximo 1000 mensajes por cliente desconectado.
# Con 400 sensores eso son solo 2,5 min de caída de la ingesta; 200 000 cubren 8 h.
max_queued_messages 200000
max_queued_bytes 0
